<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142B53" />
      <stop offset="45%" stop-color="#8B3A2B" />
      <stop offset="78%" stop-color="#DF9A4F" />
      <stop offset="100%" stop-color="#F7D08A" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sunset)" />
  <!-- Golden Sun Glow -->
  <circle cx="600" cy="440" r="170" fill="#FBE3A4" opacity="0.55" />

  <!-- Silhouette of Friends Embracing Looking Toward Sunset (Matching V2 Bottom Banner & Video Card) -->
