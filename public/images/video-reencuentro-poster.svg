    <!-- Horizon -->
    <rect x="0" y="560" width="1200" height="115" />
    <!-- 6 Friends with Arms Around Shoulders -->
    <circle cx="250" cy="390" r="36" />
    <path d="M180 570 C180 450 320 450 320 570 Z" />

    <circle cx="385" cy="375" r="38" />
    <path d="M310 570 C310 440 460 440 460 570 Z" />

    <circle cx="525" cy="365" r="40" />
    <path d="M445 570 C445 430 605 430 605 570 Z" />

    <circle cx="670" cy="368" r="39" />
    <path d="M590 570 C590 435 750 435 750 570 Z" />

    <circle cx="810" cy="378" r="37" />
    <path d="M735 570 C735 445 885 445 885 570 Z" />

    <circle cx="945" cy="392" r="36" />
    <path d="M875 570 C875 450 1015 450 1015 570 Z" />

    <!-- Connected Arms Across Shoulders -->
    <path d="M240 448 Q600 420 955 450" stroke="#161215" stroke-width="28" fill="none" stroke-linecap="round" />
  </g>
</svg>
